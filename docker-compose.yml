version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Port NOT exposed to host — only reachable within docker network
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: video_reviewer

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Port NOT exposed to host — frontend nginx proxies /api/ internally
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DB_NAME: video_reviewer
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@videoiq.app}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"   # Host nginx proxies 443 → localhost:3000
    depends_on:
      - backend

volumes:
  mongo_data:
